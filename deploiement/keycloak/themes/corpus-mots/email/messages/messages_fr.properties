# E-mails de corpus-mots (vouvoiement, ton neutre). Les messages absents ici viennent du thème de base.
# executeActions : invitation (« Créer mon mot de passe ») ; {0} lien, {4} durée de validité du lien.
executeActionsSubject=Invitation à rejoindre corpus-mots
executeActionsBody=Vous êtes invité à rejoindre corpus-mots, la banque mot-image de l''école.\n\nPour créer votre mot de passe, ouvrez ce lien :\n{0}\n\nCe lien est valable {4}. Une fois expiré, demandez à l''administrateur de l''école de vous renvoyer une invitation.\n\nSi vous n''attendiez pas cette invitation, ignorez ce message.
executeActionsBodyHtml=<p>Vous êtes invité à rejoindre corpus-mots, la banque mot-image de l''école.</p><p><a href="{0}">Créer mon mot de passe</a></p><p>Ce lien est valable {4}. Une fois expiré, demandez à l''administrateur de l''école de vous renvoyer une invitation.</p><p>Si vous n''attendiez pas cette invitation, ignorez ce message.</p>
# passwordReset : « Mot de passe oublié ».
passwordResetSubject=Choisir un nouveau mot de passe pour corpus-mots
passwordResetBody=Une demande de nouveau mot de passe a été faite pour votre compte corpus-mots.\n\nPour choisir un nouveau mot de passe, ouvrez ce lien :\n{0}\n\nCe lien est valable {3}.\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez ce message : votre mot de passe ne change pas.
passwordResetBodyHtml=<p>Une demande de nouveau mot de passe a été faite pour votre compte corpus-mots.</p><p><a href="{0}">Choisir un nouveau mot de passe</a></p><p>Ce lien est valable {3}.</p><p>Si vous n''êtes pas à l''origine de cette demande, ignorez ce message : votre mot de passe ne change pas.</p>
