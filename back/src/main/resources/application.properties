# corpus-mots : configuration du back (profils Quarkus dev, test et prod).

# API REST : toutes les ressources sous /api (AD-7).
quarkus.rest.path=/api

# Limites (conventions de l'architecture, identiques dans Caddy) :
# 100 Mo par requête ; 20 Mo par fichier, appliqués par les ressources de téléversement.
quarkus.http.limits.max-body-size=100M
corpusmots.limites.taille-fichier=20M

# Base de données : PostgreSQL. En dev et en test, les Dev Services démarrent un conteneur
# (Podman avec son socket compatible Docker) ; en prod, tout vient des variables d'environnement.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${BD_HOTE:postgres}:${BD_PORT:5432}/${BD_NOM:corpusmots}
%prod.quarkus.datasource.username=${BD_UTILISATEUR}
%prod.quarkus.datasource.password=${BD_MOT_DE_PASSE}

# Schéma : uniquement par migrations Flyway, appliquées au démarrage (AD-22).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Sécurité (AD-6) : toute ressource /api exige un jeton Keycloak valide (bearer), sauf @PermitAll explicite.
# Authentification à la demande : les refus passent par les mappers RFC 9457 de commun.api (401, 403).
quarkus.http.auth.proactive=false
quarkus.security.jaxrs.default-roles-allowed=**
quarkus.oidc.application-type=service
# Jetons émis à l'URL publique ; Keycloak est joint par le réseau interne des conteneurs
# (KC_HOSTNAME_BACKCHANNEL_DYNAMIC fait pointer jwks_uri vers l'hôte interne).
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL_INTERNE:http://keycloak:8080/auth}/realms/corpus-mots
%prod.quarkus.oidc.token.issuer=${URL_PUBLIQUE}/auth/realms/corpus-mots

# API d'administration de Keycloak, par le compte de service du client corpus-mots-back.
quarkus.keycloak.admin-client.realm=corpus-mots
quarkus.keycloak.admin-client.client-id=corpus-mots-back
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL_INTERNE:http://keycloak:8080/auth}
%prod.quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_BACK_SECRET}

# Adresse publique (lien de retour des e-mails d'invitation) et premier administrateur (vide : aucun).
corpusmots.url-publique=${URL_PUBLIQUE:http://localhost:4200}
corpusmots.admin-initial.email=${ADMIN_INITIAL_EMAIL:}

# ARASAAC (AD-9) : le back seul l'appelle (recherche par l'API, fichiers PNG par le serveur statique), délai de 3 s.
# En test, adresses injoignables : les tests remplacent la source ARASAAC par une fausse et n'appellent jamais Internet.
corpusmots.arasaac.api-url=https://api.arasaac.org
corpusmots.arasaac.static-url=https://static.arasaac.org
%test.corpusmots.arasaac.api-url=http://127.0.0.1:9
%test.corpusmots.arasaac.static-url=http://127.0.0.1:9

# Développement : conteneurs de deploiement/compose.dev.yaml (podman compose -f compose.dev.yaml up -d) ;
# le navigateur passe par le proxy d'ng serve (localhost:4200), le back joint Keycloak sur localhost:8180.
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/corpusmots
%dev.quarkus.datasource.username=corpusmots
%dev.quarkus.datasource.password=corpusmots
%dev.quarkus.keycloak.devservices.enabled=false
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/auth/realms/corpus-mots
%dev.quarkus.oidc.token.issuer=http://localhost:4200/auth/realms/corpus-mots
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180/auth
%dev.quarkus.keycloak.admin-client.client-secret=secret-de-developpement
%dev.corpusmots.admin-initial.email=${ADMIN_INITIAL_EMAIL:admin@corpus-mots.localhost}

# Tests : ni Keycloak ni tâches planifiées ; l'identité vient de @TestSecurity, Keycloak d'un double de test.
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.scheduler.enabled=false

# OpenAPI 3.1 (SmallRye) : à la construction (mvnw package), le document est écrit dans
# ../front/openapi/, d'où le front génère son client (AD-7).
quarkus.smallrye-openapi.info-title=corpus-mots
quarkus.smallrye-openapi.info-description=API de corpus-mots
quarkus.smallrye-openapi.info-license-name=AGPL-3.0
quarkus.smallrye-openapi.auto-add-server=false
# Pas de schéma de sécurité généré : il porterait l'URL interne de Keycloak, propre à l'environnement.
quarkus.smallrye-openapi.auto-add-security=false
# Ni exigence de sécurité par opération (@RolesAllowed) : elle renverrait à ce schéma absent, que le générateur
# du front ne sait pas résoudre.
quarkus.smallrye-openapi.auto-add-security-requirement=false
%prod.quarkus.smallrye-openapi.store-schema-directory=../front/openapi
