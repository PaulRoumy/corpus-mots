# corpus-mots : configuration du back (profils Quarkus dev, test et prod).

# API REST : toutes les ressources sous /api (AD-7).
quarkus.rest.path=/api

# Limites (conventions de l'architecture, identiques dans Caddy) :
# 100 Mo par requête ; 20 Mo par fichier, appliqués par les ressources de téléversement.
quarkus.http.limits.max-body-size=100M
corpusmots.limites.taille-fichier=20M

# Base de données : PostgreSQL. En dev et en test, les Dev Services démarrent un conteneur
# (Podman avec son socket compatible Docker) ; en prod, tout vient des variables d'environnement.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${BD_HOTE:postgres}:${BD_PORT:5432}/${BD_NOM:corpusmots}
%prod.quarkus.datasource.username=${BD_UTILISATEUR}
%prod.quarkus.datasource.password=${BD_MOT_DE_PASSE}

# Schéma : uniquement par migrations Flyway, appliquées au démarrage (AD-22).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# OpenAPI 3.1 (SmallRye) : à la construction (mvnw package), le document est écrit dans
# ../front/openapi/, d'où le front génère son client (AD-7).
quarkus.smallrye-openapi.info-title=corpus-mots
quarkus.smallrye-openapi.info-description=API de corpus-mots
quarkus.smallrye-openapi.info-license-name=AGPL-3.0
quarkus.smallrye-openapi.auto-add-server=false
%prod.quarkus.smallrye-openapi.store-schema-directory=../front/openapi
